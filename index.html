                <!-- 썸네일 목록. 순서대로 나선에 고르게 놓입니다. 바꾸려면 여기만 고치면 됩니다. -->

                    <a class="orbit-card" href="pages/22.html" tabindex="-1"><img src="asset/imgs/24_09.png" alt="제품 디자인"></a>

    <footer></footer>

    <script>
    (function () {
        'use strict';

        const RECENT = 6;   // 첫 화면 슬라이드에 넣을 최신 카드 수
        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

        // ── 소용돌이 ──────────────────────────────────────────
        // 카드마다 나선 위의 진행도 u(0=가운데·멀리 → 1=바깥·가까이)를 두고,
        // 시간이 흐르면 u 가 늘어나 가운데에서 바깥으로 돌며 다가옵니다.
        // 바깥 끝에 닿으면 가운데에서 다시 시작해 끊김 없이 순환합니다.
        const hero = document.getElementById('hero');
        const orbit = document.getElementById('orbit');
        const ringsSvg = document.getElementById('orbitRings');
        const center = document.querySelector('.hero-center');
        const hint = document.querySelector('.hero-hint');
        const cards = [...orbit.querySelectorAll('.orbit-card')];

        const CYCLE = 48;          // 카드 하나가 가운데→바깥까지 가는 시간(초)
        const TURNS = 0.9;         // 그동안 도는 바퀴 수(나선의 감김 정도)
        const SPIN = 0.012;        // 전체가 천천히 도는 속도(바퀴/초)

        const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
        const ease = t => 1 - Math.pow(1 - t, 3);
        const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

        let W = 0, H = 0, RMAX = 0, BASE = 200;

        // 나선 위 위치. u 에 따라 반지름이 바깥으로 빠르게 커집니다.
        const radiusAt = u => RMAX * (0.16 + 0.92 * Math.pow(u, 1.25));
        const angleAt = (u, phase) => phase + u * TURNS * Math.PI * 2;

        function layout() {
            W = hero.querySelector('.hero-sticky').clientWidth;
            H = hero.querySelector('.hero-sticky').clientHeight;
            RMAX = Math.hypot(W, H) / 2;
            BASE = clamp(W * 0.15, 120, 230);
            drawRings();
        }

        // 동심원 몇 개와, 카드가 지나는 길과 같은 나선 하나를 그립니다.
        function drawRings() {
            const cx = W / 2, cy = H / 2;
            let html = '';
            for (let k = 1; k <= 7; k++) {
                html += '<circle cx="' + cx + '" cy="' + cy + '" r="' + radiusAt(k / 7).toFixed(1) + '"/>';
            }
            let d = '';
            for (let i = 0; i <= 160; i++) {
                const u = i / 160, r = radiusAt(u), a = angleAt(u, 0);
                d += (i ? 'L' : 'M') + (cx + Math.cos(a) * r).toFixed(1) + ' ' + (cy + Math.sin(a) * r).toFixed(1);
            }
            html += '<g id="spiral"><path d="' + d + '"/></g>';
            ringsSvg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
            ringsSvg.innerHTML = html;
        }

        let clock = 0, last = performance.now(), paused = false;

        function drawOrbit(now) {
            const dt = Math.min(0.05, (now - last) / 1000);
            last = now;
            if (!paused && !reduce) clock += dt;

            const spin = clock * SPIN * Math.PI * 2;
            const n = cards.length;
            const spiral = document.getElementById('spiral');
            if (spiral) spiral.setAttribute('transform', 'rotate(' + (spin * 180 / Math.PI) + ' ' + W / 2 + ' ' + H / 2 + ')');

            cards.forEach((card, i) => {
                // 카드끼리 겹치지 않게 진행도를 고르게 나누고, 출발 각도도 황금각으로 흩어 둡니다.
                const u = ((i / n) + clock / CYCLE) % 1;
                const a = angleAt(u, spin + i * 2.39996);
                const r = radiusAt(u);
                const x = Math.cos(a) * r, y = Math.sin(a) * r;
                const s = 0.38 + 1.05 * Math.pow(u, 1.35);

                // 화면 가장자리로 갈수록 중심 쪽을 보도록 기울여 입체감을 줍니다.
                const ry = clamp(x / (W / 2), -1.2, 1.2) * -32;
                const rx = clamp(y / (H / 2), -1.2, 1.2) * 22;
                const rz = Math.sin(a) * 4;

                card.style.setProperty('--card-w', BASE + 'px');
                card.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) ' +
                    'rotateY(' + ry.toFixed(2) + 'deg) rotateX(' + rx.toFixed(2) + 'deg) rotateZ(' + rz.toFixed(2) + 'deg) ' +
                    'scale(' + s.toFixed(3) + ')';
                card.style.opacity = (smooth(0, 0.12, u) * (1 - smooth(0.9, 1, u))).toFixed(3);

                // 가까운 카드는 이름 위로, 먼 카드는 이름 뒤로 지나갑니다.
                card.style.zIndex = u > 0.62 ? 3 : 1;
                card.classList.toggle('far', u < 0.22);
                card.classList.toggle('mid', u >= 0.22 && u < 0.4);
            });

            if (!reduce) requestAnimationFrame(drawOrbit);
        }

        // 카드에 마우스를 올리면 잠시 멈춰 누를 수 있게 합니다.
        cards.forEach(card => {
            card.addEventListener('mouseenter', () => { paused = true; });
            card.addEventListener('mouseleave', () => { paused = false; });
        });

        // ── 히어로 스크롤 전환 ───────────────────────────────
        // 히어로 구간(170vh)을 지나는 비율 p(0→1)에 따라
        // 소용돌이는 다가오듯 커지며 흐려지고, 가운데 글은 위로 밀리며 사라집니다.
        function render() {
            const r = hero.getBoundingClientRect();
            const range = hero.offsetHeight - window.innerHeight;
            const p = range > 0 ? clamp(-r.top / range, 0, 1) : 0;
            const e = ease(p);

            const zoom = 'scale(' + (1 + e * 0.7) + ')';
            orbit.style.transform = zoom;
            ringsSvg.style.transform = zoom;
            orbit.style.opacity = ringsSvg.style.opacity = String(1 - clamp(p * 1.2, 0, 1));

            center.style.transform = 'translateY(' + (-e * 120) + 'px)';
            center.style.opacity = String(1 - clamp(p * 1.5, 0, 1));
            hint.style.opacity = String(1 - clamp(p * 4, 0, 1));
        }

        layout();
        window.addEventListener('resize', () => { layout(); render(); });
        requestAnimationFrame(t => { last = t; drawOrbit(t); });

        if (!reduce) {
            let queued = false;
            const onScroll = () => {
                if (queued) return;
                queued = true;
                requestAnimationFrame(() => { queued = false; render(); revealVisible(); });
            };
            // style.css 는 body 가 스크롤 컨테이너라, 캡처 단계에서 모든 스크롤을 받습니다.
            document.addEventListener('scroll', onScroll, { passive: true, capture: true });
        }
        render();

        // ── 최근 작업 슬라이드 ────────────────────────────────
        // 카드 마크업을 따로 두지 않고 list.html 에서 가져옵니다.
        // 목록을 고치면 첫 화면도 따라 바뀝니다.
        const strip = document.getElementById('worksStrip');
        const list = document.getElementById('itemList');

        // body 가 스크롤 컨테이너라 IntersectionObserver 가 스크롤 중에 갱신되지 않는
        // 경우가 있어, 히어로와 같은 스크롤 처리에서 위치로 직접 판정합니다.
        let stripShown = false;

        function revealVisible() {
            if (stripShown || !list.children.length) return;
            if (strip.getBoundingClientRect().top > window.innerHeight * 0.92) return;
            strip.classList.add('in');
            stripShown = true;
        }

        fetch('list.html', { cache: 'no-cache' })
            .then(res => { if (!res.ok) throw new Error(res.status); return res.text(); })
            .then(html => {
                const doc = new DOMParser().parseFromString(html, 'text/html');
                const items = [...doc.querySelectorAll('#itemList > li.item')]
                    .slice(0, RECENT).map(li => document.importNode(li, true));
                // 흐르는 줄이라 화면 밖 카드도 곧 들어옵니다. 지연 로딩을 풀어
                // 들어오는 순간 빈 이미지가 보이지 않게 합니다.
                items.forEach(li => li.querySelectorAll('img[loading]').forEach(img => img.removeAttribute('loading')));
                items.forEach(li => list.appendChild(li));

                // 같은 카드를 한 벌 더 붙여 두면 -50% 지점이 처음과 같아져
                // 되감을 때 이음매가 보이지 않습니다.
                items.forEach(li => {
                    const clone = li.cloneNode(true);
                    clone.setAttribute('aria-hidden', 'true');
                    list.appendChild(clone);
                });

                if (reduce) strip.classList.add('in'), stripShown = true;
                else revealVisible();
            })
            .catch(() => {
                // 파일을 직접 열어(file://) fetch 가 막힌 경우 등
                strip.outerHTML = '<p class="home-works-empty">작업 목록은 <a href="list.html">전체보기</a>에서 볼 수 있습니다.</p>';
            });
    })();
    </script>
</body>
